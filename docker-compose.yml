# Local dev only — an optional local Postgres if you don't want to use Neon
# while developing. The project defaults to Neon (see backend/.env), so this
# is not required to run anything.
version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitnova
      POSTGRES_USER: fitnova
      POSTGRES_PASSWORD: fitnova_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
